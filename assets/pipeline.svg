<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 360" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" role="img" aria-label="Three-stage multi-image understanding pipeline: dataset preparation with an OpenAI reasoning API, LoRA fine-tuning of Idefics2, and benchmarking of base and fine-tuned models against LLaVA with OpenAI answer parsing.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0f1e"/><stop offset="1" stop-color="#111a33"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#d97706"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
  </defs>
  <rect width="1180" height="360" rx="20" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1179" height="359" rx="20" fill="none" stroke="#233049"/>

  <text x="40" y="48" fill="#f1f5ff" font-size="22" font-weight="700">Multi-image understanding — reproduction pipeline</text>
  <text x="40" y="74" fill="#8ca0c4" font-size="14">Temporal &amp; reasoning tasks over sequences of images, end to end.</text>

  <line x1="60" y1="210" x2="1120" y2="210" stroke="#1f2b44" stroke-width="2"/>

  <!-- stage 1 -->
  <g filter="url(#soft)"><rect x="60" y="120" width="320" height="170" rx="14" fill="#2b2008" stroke="#7c5a12"/></g>
  <rect x="60" y="120" width="320" height="5" rx="2.5" fill="url(#amber)"/>
  <text x="86" y="152" fill="#fcd34d" font-size="12.5" font-weight="700" letter-spacing="1">1 · DATASET PREP</text>
  <text x="86" y="182" fill="#fff7e6" font-size="16.5" font-weight="700">LLM-generated explanations</text>
  <text x="86" y="208" fill="#f0cf94" font-size="13">OpenAI reasoning API writes step-by-step</text>
  <text x="86" y="226" fill="#f0cf94" font-size="13">rationales → train / eval / test JSON</text>
  <text x="86" y="258" fill="#9fb3d1" font-size="12.5">prepare_temporal_dataset.py</text>

  <!-- stage 2 -->
  <g filter="url(#soft)"><rect x="430" y="120" width="320" height="170" rx="14" fill="#1b1446" stroke="#5b3fb0"/></g>
  <rect x="430" y="120" width="320" height="5" rx="2.5" fill="url(#violet)"/>
  <text x="456" y="152" fill="#c4b5fd" font-size="12.5" font-weight="700" letter-spacing="1">2 · FINE-TUNE</text>
  <text x="456" y="182" fill="#f3efff" font-size="16.5" font-weight="700">LoRA on Idefics2</text>
  <text x="456" y="208" fill="#ddd6fe" font-size="13">low-rank adapters + a custom collator</text>
  <text x="456" y="226" fill="#ddd6fe" font-size="13">for interleaved image–text chats</text>
  <text x="456" y="258" fill="#a99be0" font-size="12.5">finetune_idefics2.py</text>

  <!-- stage 3 -->
  <g filter="url(#soft)"><rect x="800" y="120" width="320" height="170" rx="14" fill="#0b2436" stroke="#155e82"/></g>
  <rect x="800" y="120" width="320" height="5" rx="2.5" fill="url(#cyan)"/>
  <text x="826" y="152" fill="#7dd3fc" font-size="12.5" font-weight="700" letter-spacing="1">3 · BENCHMARK</text>
  <text x="826" y="182" fill="#eaf6ff" font-size="16.5" font-weight="700">Base vs fine-tuned vs LLaVA</text>
  <text x="826" y="208" fill="#bfe4fb" font-size="13">OpenAI parses free-form answers into</text>
  <text x="826" y="226" fill="#bfe4fb" font-size="13">a robust accuracy score</text>
  <text x="826" y="258" fill="#9fb3d1" font-size="12.5">benchmark_idefics2.py · benchmark-llava.py</text>

  <g stroke="#64748b" stroke-width="2.4" marker-end="url(#ar)">
    <line x1="382" y1="205" x2="426" y2="205"/>
    <line x1="752" y1="205" x2="796" y2="205"/>
  </g>

  <g font-size="12" font-weight="600">
    <g transform="translate(60,318)"><rect width="78" height="24" rx="12" fill="#13233a" stroke="#ee4c2c" stroke-opacity="0.5"/><text x="39" y="16" text-anchor="middle" fill="#ff9b86">PyTorch</text></g>
    <g transform="translate(146,318)"><rect width="110" height="24" rx="12" fill="#13233a" stroke="#ffd21e" stroke-opacity="0.5"/><text x="55" y="16" text-anchor="middle" fill="#ffe493">Hugging Face</text></g>
    <g transform="translate(264,318)"><rect width="56" height="24" rx="12" fill="#13233a" stroke="#a78bfa" stroke-opacity="0.5"/><text x="28" y="16" text-anchor="middle" fill="#c4b5fd">LoRA</text></g>
    <g transform="translate(328,318)"><rect width="110" height="24" rx="12" fill="#13233a" stroke="#38bdf8" stroke-opacity="0.5"/><text x="55" y="16" text-anchor="middle" fill="#7dd3fc">Idefics2 · LLaVA</text></g>
  </g>
</svg>
